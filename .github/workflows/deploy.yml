name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    
    steps:
      - name: 🔔 Notify deployment started
        run: echo "🚀 Starting deployment on Raspberry Pi self-hosted runner..."

      - name: 📥 Pull latest changes
        run: |
          set -e
          cd ~/hevy-mcp
          
          echo "📊 Current commit: $(git rev-parse --short HEAD)"
          
          git pull origin main || { echo "❌ Git pull failed!"; exit 1; }
          
          echo "✅ New commit: $(git rev-parse --short HEAD)"

      - name: 📦 Install dependencies
        run: |
          cd ~/hevy-mcp
          npm install || { echo "❌ npm install failed!"; exit 1; }

      - name: 🏗️ Build project
        run: |
          cd ~/hevy-mcp
          npm run build || { echo "❌ Build failed!"; exit 1; }

      - name: ♻️ Restart server
        run: |
          cd ~/hevy-mcp
          pm2 restart hevy-mcp || { echo "❌ PM2 restart failed!"; exit 1; }
          
          echo "✅ Deployment completed successfully!"
          echo ""
          echo "📊 Server status:"
          pm2 status
          
          echo ""
          echo "📋 Server logs:"
          pm2 logs hevy-mcp --lines 15 --nostream

      - name: 🧪 Verify deployment
        run: |
          echo "⏳ Waiting for server to start..."
          sleep 3
          
          echo "🔍 Testing health endpoint locally..."
          curl -f http://localhost:3000/health || exit 1
          
          echo "🔍 Testing health endpoint from internet..."
          curl -f https://hevy-rober.duckdns.org/health || exit 1
          
          echo "✅ Deployment verified successfully!"

      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "🌐 Server: https://hevy-rober.duckdns.org"
          echo "📊 Health: https://hevy-rober.duckdns.org/health"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "💥 Deployment failed!"
          echo "Check the logs above for details."
          exit 1

