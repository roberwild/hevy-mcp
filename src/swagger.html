<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hevy MCP API - Documentación</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 2rem;
            text-align: center;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .header p {
            margin: 0.5rem 0 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .status-badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 1rem;
            font-weight: 600;
        }
        
        #swagger-ui {
            max-width: 1400px;
            margin: 2rem auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .footer {
            text-align: center;
            padding: 2rem;
            color: white;
            font-size: 0.9rem;
        }
        
        .footer a {
            color: white;
            text-decoration: none;
            border-bottom: 1px solid white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏋️ Hevy MCP API</h1>
        <p>API REST para integración con ChatGPT y gestión de rutinas de entrenamiento</p>
        <div class="status-badge">✅ Online</div>
    </div>
    
    <div id="swagger-ui"></div>
    
    <div class="footer">
        Desarrollado por <a href="https://roberace.com">Roberto Gutiérrez Mourente</a> | 
        <a href="https://coolify.roberace.com">Coolify Dashboard</a>
    </div>
    
    <script src="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            const spec = {
                "openapi": "3.0.0",
                "info": {
                    "title": "Hevy MCP API",
                    "description": "API REST para gestionar entrenamientos, rutinas y ejercicios de Hevy App mediante ChatGPT",
                    "version": "1.0.0",
                    "contact": {
                        "name": "Roberto Gutiérrez Mourente",
                        "url": "https://roberace.com"
                    }
                },
                "servers": [
                    {
                        "url": "https://hevy.roberace.com",
                        "description": "Servidor de Producción"
                    }
                ],
                "paths": {
                    "/health": {
                        "get": {
                            "summary": "Health Check",
                            "description": "Verifica el estado del servidor",
                            "tags": ["Sistema"],
                            "responses": {
                                "200": {
                                    "description": "Servidor funcionando correctamente",
                                    "content": {
                                        "application/json": {
                                            "schema": {
                                                "type": "object",
                                                "properties": {
                                                    "status": { "type": "string", "example": "ok" },
                                                    "timestamp": { "type": "string", "example": "2025-12-08T20:00:00.000Z" },
                                                    "server": { "type": "string", "example": "Railway Simple HTTP Server" }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    },
                    "/mcp": {
                        "post": {
                            "summary": "Endpoint Principal MCP",
                            "description": "Endpoint principal para todas las operaciones. Usa JSON-RPC 2.0",
                            "tags": ["MCP"],
                            "requestBody": {
                                "required": true,
                                "content": {
                                    "application/json": {
                                        "schema": {
                                            "type": "object",
                                            "required": ["method"],
                                            "properties": {
                                                "jsonrpc": { "type": "string", "example": "2.0" },
                                                "method": { 
                                                    "type": "string", 
                                                    "enum": [
                                                        "help",
                                                        "getLastWorkout",
                                                        "getWorkouts",
                                                        "searchWorkouts",
                                                        "getRoutines",
                                                        "getRoutineFolders",
                                                        "createRoutine",
                                                        "updateRoutine",
                                                        "getRoutineDetails",
                                                        "addExerciseToRoutine",
                                                        "getExerciseTemplates",
                                                        "searchExerciseTemplates",
                                                        "getExerciseTemplate"
                                                    ]
                                                },
                                                "params": { "type": "object" },
                                                "id": { "type": "integer", "example": 1 }
                                            }
                                        },
                                        "examples": {
                                            "help": {
                                                "summary": "Obtener ayuda",
                                                "value": {
                                                    "jsonrpc": "2.0",
                                                    "method": "help",
                                                    "params": {},
                                                    "id": 1
                                                }
                                            },
                                            "getLastWorkout": {
                                                "summary": "Último entrenamiento",
                                                "value": {
                                                    "jsonrpc": "2.0",
                                                    "method": "getLastWorkout",
                                                    "params": { "count": 1 },
                                                    "id": 1
                                                }
                                            },
                                            "getRoutines": {
                                                "summary": "Listar rutinas",
                                                "value": {
                                                    "jsonrpc": "2.0",
                                                    "method": "getRoutines",
                                                    "params": { "page": 1, "pageSize": 5 },
                                                    "id": 1
                                                }
                                            },
                                            "searchExerciseTemplates": {
                                                "summary": "Buscar ejercicios",
                                                "value": {
                                                    "jsonrpc": "2.0",
                                                    "method": "searchExerciseTemplates",
                                                    "params": { "query": "press banca", "limit": 10 },
                                                    "id": 1
                                                }
                                            },
                                            "createRoutine": {
                                                "summary": "Crear rutina",
                                                "value": {
                                                    "jsonrpc": "2.0",
                                                    "method": "createRoutine",
                                                    "params": {
                                                        "title": "Mi Nueva Rutina",
                                                        "folderName": "Personal",
                                                        "exercises": [
                                                            {
                                                                "exerciseTemplateId": "79D0BB3A",
                                                                "sets": [
                                                                    { "type": "normal", "reps": 10, "weightKg": 60 },
                                                                    { "type": "normal", "reps": 8, "weightKg": 65 },
                                                                    { "type": "normal", "reps": 6, "weightKg": 70 }
                                                                ],
                                                                "restSeconds": 90,
                                                                "notes": "Mantener forma estricta"
                                                            }
                                                        ]
                                                    },
                                                    "id": 1
                                                }
                                            }
                                        }
                                    }
                                }
                            },
                            "responses": {
                                "200": {
                                    "description": "Operación exitosa",
                                    "content": {
                                        "application/json": {
                                            "schema": {
                                                "type": "object",
                                                "properties": {
                                                    "jsonrpc": { "type": "string" },
                                                    "result": { "type": "object" },
                                                    "id": { "type": "integer" }
                                                }
                                            }
                                        }
                                    }
                                },
                                "400": {
                                    "description": "Petición inválida"
                                },
                                "500": {
                                    "description": "Error del servidor"
                                }
                            }
                        }
                    }
                },
                "components": {
                    "schemas": {
                        "Exercise": {
                            "type": "object",
                            "properties": {
                                "exerciseTemplateId": {
                                    "type": "string",
                                    "description": "ID del ejercicio (8 caracteres)",
                                    "example": "79D0BB3A"
                                },
                                "sets": {
                                    "type": "array",
                                    "items": {
                                        "type": "object",
                                        "properties": {
                                            "type": { "type": "string", "enum": ["normal", "warmup", "failure"], "example": "normal" },
                                            "reps": { "type": "integer", "example": 10 },
                                            "weightKg": { "type": "number", "example": 60 }
                                        }
                                    }
                                },
                                "restSeconds": { "type": "integer", "example": 90 },
                                "notes": { "type": "string", "example": "Mantener forma" }
                            }
                        }
                    }
                },
                "tags": [
                    {
                        "name": "Sistema",
                        "description": "Endpoints de sistema y health checks"
                    },
                    {
                        "name": "MCP",
                        "description": "Endpoint principal para operaciones MCP"
                    }
                ]
            };
            
            window.ui = SwaggerUIBundle({
                spec: spec,
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                docExpansion: "list",
                filter: true,
                tryItOutEnabled: true
            });
        }
    </script>
</body>
</html>
