---
# Homepage configuration
# See https://github.com/bastienwirtz/homer/blob/main/docs/configuration.md

title: "Raspberry Pi Dashboard"
subtitle: "Monitoring & Services"
logo: "logo.png"
# icon: "fas fa-skull-crossbones" # Optional icon

header: true
footer: '<p>Raspberry Pi 5 (8GB) | <a href="https://github.com/bastienwirtz/homer">Homer</a></p>'

# Optional theme
theme: default
colors:
  light:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#f5f5f5"
    card-background: "#ffffff"
    text: "#363636"
    text-header: "#ffffff"
    text-title: "#303030"
    text-subtitle: "#424242"
    card-shadow: rgba(0, 0, 0, 0.1)
    link: "#3273dc"
    link-hover: "#363636"
  dark:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#131313"
    card-background: "#2b2b2b"
    text: "#eaeaea"
    text-header: "#ffffff"
    text-title: "#fafafa"
    text-subtitle: "#f5f5f5"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#3273dc"
    link-hover: "#ffdd57"

# Optional navbar
links:
  - name: "GitHub"
    icon: "fab fa-github"
    url: "https://github.com/"
    target: "_blank"
  - name: "Documentation"
    icon: "fas fa-book"
    url: "#"

# Services
services:
  - name: "Monitoring & Analytics"
    icon: "fas fa-chart-line"
    items:
      - name: "Grafana"
        logo: "https://grafana.com/static/assets/img/fav32.png"
        subtitle: "Dashboards y visualización"
        tag: "analytics"
        url: "https://grafana.roberace.com"
        target: "_blank"

      - name: "Prometheus"
        logo: "https://prometheus.io/assets/favicons/favicon-32x32.png"
        subtitle: "Métricas del sistema (solo red local)"
        tag: "metrics"
        url: "http://192.168.1.210:9090"
        target: "_blank"

      - name: "Uptime Kuma"
        logo: "https://uptime.kuma.pet/img/icon.svg"
        subtitle: "Monitor de disponibilidad"
        tag: "monitoring"
        url: "https://uptime.roberace.com"
        target: "_blank"

  - name: "Infrastructure"
    icon: "fas fa-server"
    items:
      - name: "Coolify"
        logo: "https://cdn.coollabs.io/assets/coolify/logo.png"
        subtitle: "Self-hosted PaaS"
        tag: "platform"
        url: "https://coolify.roberace.com"
        target: "_blank"

      - name: "Portainer"
        logo: "https://www.portainer.io/hubfs/portainer-logo-black.svg"
        subtitle: "Gestión Docker"
        tag: "docker"
        url: "https://portainer.roberace.com"
        target: "_blank"

      - name: "pgAdmin"
        logo: "https://www.pgadmin.org/static/COMPILED/img/favicon.ico"
        subtitle: "PostgreSQL Admin"
        tag: "database"
        url: "https://pgadmin.roberace.com"
        target: "_blank"

  - name: "Applications"
    icon: "fas fa-cloud"
    items:
      - name: "Hevy MCP"
        logo: "https://fastapi.tiangolo.com/img/favicon.png"
        subtitle: "Hevy API Application"
        tag: "api"
        url: "https://hevy.roberace.com"
        target: "_blank"

      # Añade más servicios aquí según los vayas creando
      # - name: "Otra API"
