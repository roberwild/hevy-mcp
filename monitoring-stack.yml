version: '3.8'

# Stack de Monitoring para Raspberry Pi 5
# Incluye: Grafana, Prometheus, Portainer, pgAdmin, Uptime Kuma, Homer
# Uso: docker-compose -f monitoring-stack.yml up -d

services:
  # ============================================
  # GRAFANA - Dashboards y visualización
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # ⚠️ CAMBIAR EN PRODUCCIÓN
      - GF_USERS_ALLOW_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.roberace.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring
      - coolify
    depends_on:
      - prometheus
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-http.rule=Host(`grafana.roberace.com`)"
      - "traefik.http.routers.grafana-http.entrypoints=http"
      - "traefik.http.routers.grafana-http.middlewares=redirect-to-https"
      - "traefik.http.routers.grafana-https.rule=Host(`grafana.roberace.com`)"
      - "traefik.http.routers.grafana-https.entrypoints=https"
      - "traefik.http.routers.grafana-https.tls=true"
      - "traefik.http.routers.grafana-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      - "traefik.docker.network=coolify"

  # ============================================
  # PROMETHEUS - Recolección de métricas
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring

  # ============================================
  # NODE EXPORTER - Métricas del sistema
  # ============================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  # ============================================
  # PORTAINER - Gestión Docker visual
  # ============================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - monitoring
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer-http.rule=Host(`portainer.roberace.com`)"
      - "traefik.http.routers.portainer-http.entrypoints=http"
      - "traefik.http.routers.portainer-http.middlewares=redirect-to-https"
      - "traefik.http.routers.portainer-https.rule=Host(`portainer.roberace.com`)"
      - "traefik.http.routers.portainer-https.entrypoints=https"
      - "traefik.http.routers.portainer-https.tls=true"
      - "traefik.http.routers.portainer-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.docker.network=coolify"

  # ============================================
  # PGADMIN - PostgreSQL Admin Web
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com  # ⚠️ CAMBIAR
      - PGADMIN_DEFAULT_PASSWORD=admin         # ⚠️ CAMBIAR
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - monitoring
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin-http.rule=Host(`pgadmin.roberace.com`)"
      - "traefik.http.routers.pgadmin-http.entrypoints=http"
      - "traefik.http.routers.pgadmin-http.middlewares=redirect-to-https"
      - "traefik.http.routers.pgadmin-https.rule=Host(`pgadmin.roberace.com`)"
      - "traefik.http.routers.pgadmin-https.entrypoints=https"
      - "traefik.http.routers.pgadmin-https.tls=true"
      - "traefik.http.routers.pgadmin-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      - "traefik.docker.network=coolify"

  # ============================================
  # UPTIME KUMA - Monitor de disponibilidad
  # ============================================
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - monitoring
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-http.rule=Host(`uptime.roberace.com`)"
      - "traefik.http.routers.uptime-http.entrypoints=http"
      - "traefik.http.routers.uptime-http.middlewares=redirect-to-https"
      - "traefik.http.routers.uptime-https.rule=Host(`uptime.roberace.com`)"
      - "traefik.http.routers.uptime-https.entrypoints=https"
      - "traefik.http.routers.uptime-https.tls=true"
      - "traefik.http.routers.uptime-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
      - "traefik.docker.network=coolify"

  # ============================================
  # HOMER - Dashboard de enlaces/homepage
  # ============================================
  homer:
    image: b4bz/homer:latest
    container_name: homer
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - INIT_ASSETS=1
    volumes:
      - ./homer/assets:/www/assets
    networks:
      - monitoring
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homer-http.rule=Host(`homer.roberace.com`)"
      - "traefik.http.routers.homer-http.entrypoints=http"
      - "traefik.http.routers.homer-http.middlewares=redirect-to-https"
      - "traefik.http.routers.homer-https.rule=Host(`homer.roberace.com`)"
      - "traefik.http.routers.homer-https.entrypoints=https"
      - "traefik.http.routers.homer-https.tls=true"
      - "traefik.http.routers.homer-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.homer.loadbalancer.server.port=8080"
      - "traefik.docker.network=coolify"

  # ============================================
  # CADVISOR - Métricas de contenedores Docker
  # ============================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring

  # ============================================
  # LOKI - Agregador de logs
  # ============================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - monitoring

  # ============================================
  # PROMTAIL - Recolector de logs
  # ============================================
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/rober/.pm2/logs:/home/rober/.pm2/logs:ro
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki

volumes:
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  portainer_data:
    driver: local
  pgadmin_data:
    driver: local
  uptime_kuma_data:
    driver: local
  loki_data:
    driver: local

networks:
  monitoring:
    driver: bridge
  coolify:
    external: true

